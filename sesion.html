<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservaciones</title>
    <link rel="stylesheet" href="diseño.css">

    <p style="font-size: 100px;">Lumina <strong>Studio</strong></p><br><br>
    <p style="font-size: 50px;">Completa tus datos para reservar una fecha</p><br><br>
</head>
    
<body id="reserv">
    
    <form  action="" method=""><br>
        <label for="nombre" class="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="nombre" class="nombre">Correo electrónico</label>
        <input type="text" id="nombre" name="nombre" required><br><br>
        
        <label for="nombre" class="nombre">Número de celular</label>
        <input type="tel" id="nombre" name="nombre" required><br><br>

       <label for="hora" class="hora-label">Hora</label>
        <input type="time" id="hora" name="hora" min="09:00" max="17:00" required>


        <label for="fecha">Fecha deseada</label>
        <input type="date" id="fecha" name="fecha" min="09:00" max="17:00" required><br><br>

        <label for="Tipo de evento">Tipo de sesión</label>
    <select name="Tippo de evento" id="Tipo de evento">
    <option value="Boda">Personal</option>
    <option value="15 años" selected>Familiar</option>
    <option value="Bautizo">Pareja</option>
     <option value="Cumpleaños">Otro</option>
    </select><br>
    <label for="fecha">Si marcaste "otro" escribe la opción</label><br>
    <input type="text" id="nombre" name="nombre">
    <br>
    
    <br>
    
        <label for="fecha">Confirmar fecha y horario</label><br>
        <input type="datetime-local" id="fecha" name="fecha" value="Fecha">
        <br>
        <br>
        <button value="enviar"id="enviar">Enviar</button>
        
    
</body>
</html>
